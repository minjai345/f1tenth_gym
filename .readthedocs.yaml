# Read the Docs configuration. https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

python:
  install:
    # Install the package itself so autodoc can import f1tenth_gym, plus the
    # docs-only requirements (Sphinx + theme).
    - method: pip
      path: .
    - requirements: docs/requirements.txt

formats:
  - pdf
