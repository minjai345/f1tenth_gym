[project]
name = "f1tenth_gym"
version = "1.0.0dev"
description = "Gym environment for F1TENTH"
authors = [
    { name = "Hongrui Zheng" },
    { name = "Renukanandan Tumu" },
    { name = "Luigi Berducci" },
    { name = "Ahmad Amine" },
    { name = "Joseph Auckley" },
    { name = "Matthew O'Kelly" },
    { name = "Aman Sinha" },
]
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
maintainers = [{ name = "Hongrui Zheng" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "gymnasium>=0.29.1,<0.30",
    "numpy>=1.18",
    "pillow>=9.1.0",
    "scipy>=1.13.0",
    "numba>=0.59.0",
    "PyYAML>=5.3.1",
    "PyOpenGL>=3.1.9",           # required transitively by pyqtgraph.opengl
    "PyOpenGL-accelerate>=3.1.9",
    "opencv-python>=4.9.0.80",
    "requests>=2.31.0",
    "pyqtgraph>=0.13.7,<0.14",
    "pyqt6>=6.7.1,<7",
    "jax>=0.11.1",              # CPU-capable everywhere; GPU via the `cuda` extra
    "scikit-image>=0.25",       # marching squares + Douglas-Peucker for wall extraction
]

[project.urls]
Homepage = "https://f1tenth.org"
Repository = "https://github.com/f1tenth/f1tenth_gym"
Documentation = "https://f1tenth-gym.readthedocs.io/en/latest/"

[project.optional-dependencies]
# Used only by scripts in examples/; the library needs none of them.
video = ["moviepy>=1.0.0"]                          # gymnasium RecordVideo backend
trackgen = ["shapely>=2.0", "matplotlib>=3.8.2,<4"] # examples/random_trackgen.py
# jax-cuda13-plugin/-pjrt ship manylinux wheels only, no sdist: without the marker
# every macOS/Windows install fails. The cuda13 extra does not exist before jax 0.7.
cuda = ["jax[cuda13]>=0.11.1; sys_platform == 'linux'"]

[tool.pytest.ini_options]
minversion = 6.0
addopts = "-ra"
testpaths =[
    "tests",
]

[dependency-groups]
dev = [
    "pytest>=7.4.4,<8",
    "black>=23.12.1,<24",
    "ipykernel>=6.29.0,<7",
    "isort>=5.13.2,<6",
    "autoflake>=2.2.1,<3",
    "matplotlib>=3.8.2,<4",
    "flake8>=7.0.0,<8",
]
# `uv sync` is exact: it prunes anything not derivable from pyproject/uv.lock.
# Declaring these here is what stops it uninstalling moviepy and shapely.
examples = ["f1tenth_gym[video,trackgen]"]
# Groups are not published in the wheel, so downstream installs get CPU jax and
# opt in with `f1tenth_gym[cuda]`. Skip locally with `uv sync --no-group gpu`.
gpu = ["f1tenth_gym[cuda]"]
docs = ["sphinx>=7,<10", "sphinx-rtd-theme>=2"]

[tool.uv]
default-groups = ["dev", "examples", "gpu"]

[tool.uv.build-backend]
module-name = ["f1tenth_gym"]
module-root = ""

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"
