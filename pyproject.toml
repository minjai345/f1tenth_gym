[project]
name = "f1tenth_gym"
version = "1.0.0dev"
description = "Gym environment for F1TENTH"
authors = [
    { name = "Hongrui Zheng" },
    { name = "Renukanandan Tumu" },
    { name = "Luigi Berducci" },
    { name = "Ahmad Amine" },
    { name = "Joseph Auckley" },
    { name = "Matthew O'Kelly" },
    { name = "Aman Sinha" },
]
requires-python = ">=3.9"
readme = "README.md"
license = "MIT"
maintainers = [{ name = "Hongrui Zheng" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "gymnasium>=0.29.1,<0.30",
    "numpy>=1.18",
    "pillow>=9.1.0",
    "scipy>=1.13.0",
    "numba>=0.59.0",
    "PyYAML>=5.3.1",
    "PyOpenGL>=3.1.9",           # required transitively by pyqtgraph.opengl
    "PyOpenGL-accelerate>=3.1.9",
    "opencv-python>=4.9.0.80",
    "requests>=2.31.0",
    "pyqtgraph>=0.13.7,<0.14",
    "pyqt6>=6.7.1,<7",
]

[project.urls]
Homepage = "https://f1tenth.org"
Repository = "https://github.com/f1tenth/f1tenth_gym"
Documentation = "https://f1tenth-gym.readthedocs.io/en/latest/"

[project.optional-dependencies]
# Extras used only by scripts in examples/ -- the library itself needs none of
# these. They are extras rather than dev dependencies so that pip users can opt
# in with `pip install f1tenth_gym[video]`.
video = ["moviepy>=1.0.0"]                          # gymnasium RecordVideo backend
trackgen = ["shapely>=2.0", "matplotlib>=3.8.2,<4"] # examples/random_trackgen.py

[tool.pytest.ini_options]
minversion = 6.0
addopts = "-ra"
testpaths =[
    "tests",
    "integration",
]

[dependency-groups]
dev = [
    "pytest>=7.4.4,<8",
    "black>=23.12.1,<24",
    "ipykernel>=6.29.0,<7",
    "isort>=5.13.2,<6",
    "autoflake>=2.2.1,<3",
    "matplotlib>=3.8.2,<4",
    "flake8>=7.0.0,<8",
]
# `uv sync` is an exact sync: it prunes anything it cannot derive from
# pyproject/uv.lock. Declaring the example dependencies here is what stops it
# uninstalling moviepy and shapely on every sync.
examples = ["f1tenth_gym[video,trackgen]"]

[tool.uv]
default-groups = ["dev", "examples"]

[tool.uv.build-backend]
module-name = ["f1tenth_gym"]
module-root = ""

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"
