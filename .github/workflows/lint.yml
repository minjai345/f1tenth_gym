name: Linting Checks

on:
  push:
    branches: [ main , 'v*', 'dev*']
  pull_request:
    branches: [ main , 'v*' ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    # Keep this small job on the committed resolution without installing the
    # project, examples, or the ~3 GB CUDA stack.
    - name: Install lint tools
      run: uv sync --frozen --only-group lint --no-install-project

    - name: Lint with flake8
      # exit-zero treats all errors as warnings; advisory only
      run: >-
        uv run --no-sync flake8
        f1tenth_gym tests examples docs/style_lint.py
        --statistics --exit-zero

    - name: Check the docs house style
      # gating since the Batch F rewrite (#21): the registries in docs/_style
      # ratchet, so this can only get stricter
      run: uv run --no-sync python docs/style_lint.py --strict
