name: Linting Checks

on:
  push:
    branches: [ main , 'v*', 'dev*']
  pull_request:
    branches: [ main , 'v*' ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    # Neither check imports f1tenth_gym -- flake8 only walks files and
    # style_lint.py imports nothing but the stdlib and yaml -- so the project is
    # never synced here. `uv run --no-project --with` fetches just the tool into
    # an ephemeral env, which also keeps the ~3 GB CUDA stack out of this job.
    - name: Lint with flake8
      # exit-zero treats all errors as warnings; advisory only
      run: uv run --no-project --with flake8 flake8 . --statistics --exit-zero

    - name: Check the docs house style
      # gating since the Batch F rewrite (#21): the registries in docs/_style
      # ratchet, so this can only get stricter
      run: uv run --no-project --with pyyaml python docs/style_lint.py --strict
