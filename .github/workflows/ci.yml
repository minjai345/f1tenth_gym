name: CI

on:
  push:
    branches: [ main , 'v*', 'dev*']
  pull_request:
    branches: [ main , 'v*' ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    # Rendering uses OpenGL, which needs a display; tests run under xvfb-run
    # (QT_QPA_PLATFORM=xcb). The GL widget cannot render under 'offscreen'.

    steps:
    - name: Update apt
      run: sudo apt update

    - name: Install openGL and xvfb
      # Qt 6.5+ refuses to load its xcb platform plugin without libxcb-cursor0
      # and aborts the process; libgl1-mesa-dri is the software GL xvfb needs.
      run: sudo apt install -y freeglut3-dev libglib2.0-0 libsm6 libxrender1 libxext6 libxkbcommon-x11-0 libdbus-1-dev xvfb
           libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libgl1-mesa-dri

    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install
      # Installs the project plus the dev group (pytest, flake8) and examples.
      # --no-group gpu skips ~3 GB of CUDA wheels the runner has no GPU for.
      run: uv sync --no-group gpu

    - name: Test with pytest
      # rgb_array rendering defaults to the GL backend, which needs a display;
      # xvfb-run provides a virtual one so the default render path is tested.
      run: xvfb-run -a uv run --no-sync pytest


  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.12"
        enable-cache: true

    - name: Install
      # autodoc imports f1tenth_gym, so the project itself is needed; the docs
      # group carries Sphinx. No GPU on the runner, so skip the CUDA wheels.
      run: uv sync --group docs --no-group gpu

    - name: Build docs (warnings are errors)
      run: uv run --no-sync python -m sphinx -W -b html docs docs/_build/html

    - name: Run doctests
      run: uv run --no-sync python -m sphinx -b doctest docs docs/_build/doctest

    - name: Check links
      # external links flake; report without failing the build
      continue-on-error: true
      run: uv run --no-sync python -m sphinx -b linkcheck docs docs/_build/linkcheck
